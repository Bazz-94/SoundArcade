  title: "Input mapping and Player Controller integration"
  description: "Implement IInput handling in Infrastructure and expose a mapping system allowing keyboard remapping for core actions (MoveLeft, MoveRight, Action, Pause). Provide PlayerController in Application that consumes IInput and issues domain commands. Ensure all input flows through Abstractions and supports keyboard-only controls per accessibility rules."

  scope:
