name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SoundArcade.slnx

      - name: Verify Formatting
        run: dotnet format SoundArcade.slnx --verify-no-changes

      - name: Build
        run: dotnet build SoundArcade.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SoundArcade.slnx --configuration Release --no-build
