name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Source/**'
      - '.github/workflows/*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Source/**'
      - '.github/workflows/*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Source/SoundArcade.slnx

      - name: Build
        run: dotnet build Source/SoundArcade.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Source/SoundArcade.slnx --configuration Release --no-build
